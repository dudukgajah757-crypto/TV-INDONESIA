<style>
:root{--bg:#f2f3f5;--card:#fff;--text:#14161a;--muted:#6b7280;--accent:#e11d48;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0c10;--card:#171a21;--text:#f1f2f4;--muted:#9aa1ad;color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
#wrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#000;aspect-ratio:16/9;width:100%;max-height:45vh;margin:0 auto;overflow:hidden;user-select:none}
#wrap:fullscreen{max-height:none;aspect-ratio:auto;width:100%;height:100%}
#wrap:-webkit-full-screen{max-height:none;aspect-ratio:auto;width:100%;height:100%}
video{width:100%;height:100%;background:#000;object-fit:contain;display:block}
#hud{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:8px 10px;color:#fff;background:linear-gradient(#0009,transparent 30%,transparent 70%,#0009);opacity:0;transition:opacity .25s;pointer-events:none}
#hud.on{opacity:1}
#hud button{pointer-events:auto}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
#now{font-weight:600;font-size:15px}
.btn{background:#ffffff26;color:#fff;border:0;border-radius:8px;padding:7px 11px;font-size:14px;cursor:pointer}
#msg{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:#fff;font-size:14px;text-align:center;padding:16px;pointer-events:none;background:#000a}
#msg.on{display:flex}
#msg button{pointer-events:auto;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px}
.spin{width:28px;height:28px;border:3px solid #fff4;border-top-color:#fff;border-radius:50%;animation:r .8s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px}
#bar h1{font-size:15px;margin:0}
#bar .btn{background:var(--card);color:var(--text);border:1px solid #8884}
#add{display:none;padding:0 12px 8px;gap:6px;flex-wrap:wrap}
#add.on{display:flex}
#add input{flex:1 1 140px;padding:9px;border-radius:8px;border:1px solid #8886;background:var(--card);color:var(--text);font-size:14px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;padding:0 12px 24px}
.ch{background:var(--card);border:2px solid transparent;border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;color:var(--text);font-size:12.5px;line-height:1.25;word-break:break-word}
.ch i{display:block;font-style:normal;font-size:22px;margin-bottom:4px}
.ch.act{border-color:var(--accent)}
.ch.bad{opacity:.45}
</style>
</head>
<body>
<div id="wrap">
  <video id="v" playsinline webkit-playsinline autoplay></video>
  <div id="msg"><div class="spin"></div><span id="mt">Memuat…</span></div>
  <div id="hud">
    <div class="row"><span id="now">Pilih channel</span><button class="btn" id="rot" hidden>Putar</button></div>
    <div class="row"><span style="font-size:12px;opacity:.8">Ketuk 2x untuk layar penuh</span><button class="btn" id="fs">Layar penuh</button></div>
  </div>
</div>
<div id="bar"><h1>TV Indonesia</h1><button class="btn" id="addb">+ Channel</button></div>
<div id="add">
  <input id="an" placeholder="Nama channel">
  <input id="au" placeholder="Link .m3u8">
  <button class="btn" id="as" style="background:var(--accent);color:#fff">Simpan</button>
</div>
<div id="list"></div>

 {name:"MAGNA Channel",emoji:"💡",url:"https://edge.medcom.id/live-edge/smil:magna.smil/playlist.m3u8",fallback:"https://op-flashcon-digdayahd-1.dens.tv/h/h24/01.m3u8"},

try{ var saved=JSON.parse(localStorage.getItem("tv_custom")||"[]"); CH=CH.concat(saved);}catch(e){}

var $=function(i){return document.getElementById(i)};
var v=$("v"), wrap=$("wrap"), hud=$("hud"), msg=$("msg"), mt=$("mt"), list=$("list");
var hls=null, cur=-1, tok=0, hudT, wd, played=false;

function render(){
  list.innerHTML="";
  CH.forEach(function(c,i){
    var b=document.createElement("button");
    b.className="ch"+(i===cur?" act":"");
    b.innerHTML="<i></i><span></span>";
    b.firstChild.textContent=c.emoji||"📺";
    b.lastChild.textContent=c.name;
    b.onclick=function(){play(i)};
    list.appendChild(b);
  });
}
function showMsg(t,retry){
  msg.classList.add("on");
  msg.innerHTML=(retry?"":'<div class="spin"></div>')+"<span>"+t+"</span>"+(retry?'<button id="rt">Coba lagi</button>':"");
  if(retry)$("rt").onclick=function(){play(cur)};
}
function hideMsg(){msg.classList.remove("on")}
function kill(){ clearTimeout(wd); if(hls){hls.destroy();hls=null} v.onerror=null; v.removeAttribute("src"); }

// Daftar jalur percobaan: link utama lalu cadangan, tiap link lewat Worker, langsung, dan proxy publik
function routes(c){
  var r=[], us=[c.url].concat(c.fallback?[c.fallback]:[]), h=c.headers;
  us.forEach(function(u){
    var http=/^http:/.test(u);
    if(PROXY) r.push({u:u,p:function(x){return PROXY+"/?url="+encodeURIComponent(x)+(h?"&ref="+encodeURIComponent(h.Referer):"")}});
    if(!http&&!h) r.push({u:u});
    PUB.forEach(function(P){ r.push({u:u,p:function(x){return P+encodeURIComponent(x)}}) });
    if(!http&&h) r.push({u:u});
  });
  return r;
}

function load(rt,my,fail){
  kill();
  var dead=false, rec=false;
  var f=function(){ if(dead||my!==tok)return; dead=true; kill(); fail() };
  wd=setTimeout(function(){ if(!played) f() },15000);
  if(window.Hls&&Hls.isSupported()){
    var cfg={lowLatencyMode:false,maxBufferLength:8,maxMaxBufferLength:20,backBufferLength:10,startFragPrefetch:true,capLevelToPlayerSize:true,manifestLoadingMaxRetry:0,manifestLoadingTimeOut:9000,levelLoadingMaxRetry:1,fragLoadingMaxRetry:2};
    if(rt.p) cfg.xhrSetup=function(x,u){ x.open("GET",rt.p(u),true) };
    hls=new Hls(cfg);
    hls.on(Hls.Events.MANIFEST_PARSED,function(){ if(my===tok) v.play().catch(function(){}) });
    hls.on(Hls.Events.ERROR,function(_,d){
      if(my!==tok||!d.fatal)return;
      if(d.type===Hls.ErrorTypes.MEDIA_ERROR&&!rec){rec=true;hls.recoverMediaError();return}
      f();
    });
    hls.loadSource(rt.u); hls.attachMedia(v);
  }else if(!rt.p&&v.canPlayType("application/vnd.apple.mpegurl")){
    v.src=rt.u; v.play().catch(function(){});
    v.onerror=f;
  }else f();
}
function play(i){
  if(i<0)return;
  cur=i; var c=CH[i], my=++tok; played=false;
  $("now").textContent=c.name;
  Array.prototype.forEach.call(list.children,function(el,k){el.classList.toggle("act",k===i);el.classList.remove("bad")});
  showMsg("Memuat "+c.name+"…");
  flash();
  var rs=routes(c), k=0;
  var next=function(){
    if(my!==tok)return;
    if(k>=rs.length){
      list.children[i]&&list.children[i].classList.add("bad");
      showMsg("Channel tidak bisa diputar sekarang",true);
      return;
    }
    if(k>0) showMsg("Mencoba jalur "+(k+1)+" dari "+rs.length+"…");
    load(rs[k++],my,next);
  };
  next();
}
v.addEventListener("playing",function(){played=true;clearTimeout(wd);hideMsg()});
v.addEventListener("waiting",function(){ if(cur>=0) showMsg("Buffering…") });
v.addEventListener("canplay",function(){hideMsg()});

function flash(){hud.classList.add("on");clearTimeout(hudT);hudT=setTimeout(function(){hud.classList.remove("on")},2800)}

function isFs(){return document.fullscreenElement||document.webkitFullscreenElement}
function enter(){
  var p;
  if(wrap.requestFullscreen) p=wrap.requestFullscreen();
  else if(wrap.webkitRequestFullscreen) p=wrap.webkitRequestFullscreen();
  else if(v.webkitEnterFullscreen){ v.webkitEnterFullscreen(); return }
  Promise.resolve(p).then(function(){
    if(screen.orientation&&screen.orientation.lock){ screen.orientation.lock("any").catch(function(){ return screen.orientation.lock("landscape") }).catch(function(){}) }
  }).catch(function(){});
}
function leave(){
  if(screen.orientation&&screen.orientation.unlock){try{screen.orientation.unlock()}catch(e){}}
  (document.exitFullscreen||document.webkitExitFullscreen).call(document);
}
function toggleFs(){ isFs()?leave():enter() }
function onFsChange(){ $("rot").hidden=!isFs(); $("fs").textContent=isFs()?"Keluar":"Layar penuh"; if(!isFs()&&screen.orientation&&screen.orientation.unlock){try{screen.orientation.unlock()}catch(e){}} flash() }
document.addEventListener("fullscreenchange",onFsChange);
document.addEventListener("webkitfullscreenchange",onFsChange);
$("fs").onclick=function(e){e.stopPropagation();toggleFs()};
$("rot").onclick=function(e){
  e.stopPropagation();
  if(!(screen.orientation&&screen.orientation.lock))return;
  var land=screen.orientation.type.indexOf("landscape")===0;
  screen.orientation.lock(land?"portrait":"landscape").catch(function(){});
};

var lastTap=0;
wrap.addEventListener("pointerup",function(e){
  if(e.target.closest&&e.target.closest("button"))return;
  var now=Date.now();
  if(now-lastTap<320){lastTap=0;toggleFs()}else{lastTap=now;flash()}
});

$("addb").onclick=function(){$("add").classList.toggle("on")};
$("as").onclick=function(){
  var n=$("an").value.trim(),u=$("au").value.trim();
  if(!n||!/^https?:\/\//.test(u))return;
  var c={name:n,emoji:"➕",url:u};
  CH.push(c);
  try{var s=JSON.parse(localStorage.getItem("tv_custom")||"[]");s.push(c);localStorage.setItem("tv_custom",JSON.stringify(s))}catch(e){}
  $("an").value="";$("au").value="";$("add").classList.remove("on");
  render(); play(CH.length-1);
};

render();
</script>
